name: Unit 1 Lessons 1–6 Playwright
on:
  pull_request:
    branches: [main]
    paths:
      - "src/content/lessons/lesson-1-*.ts"
      - "src/content/lessons/unit-1-helpers.ts"
      - "src/components/lesson/interactive/**"
      - "src/components/lesson/BookPracticeActivity.tsx"
      - "src/components/lesson/interactive/BookPracticeActivity.tsx"
      - "src/components/lesson/LessonContent.tsx"
      - "src/content/types.ts"
      - "tests/lesson-*.spec.mjs"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/lesson5-playwright.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit1-lessons:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser suite
        shell: bash
        run: |
          run_suite() {
            name="$1"; shift
            set +e
            "$@" 2>&1 | tee "/tmp/${name}.log"
            result=${PIPESTATUS[0]}
            if [ "$result" -ne 0 ]; then
              grep -E 'Error:|Expected:|Received:|Test timeout|Timeout|Failed|failed|pageerror|console error|Call log|waiting for|locator\.|getBy|^[[:space:]]+[0-9]+\)' "/tmp/${name}.log" | tail -n 50 | while IFS= read -r line; do echo "::error::$line"; done
              return "$result"
            fi
          }
          run_suite abc-rays npm run test:e2e -- tests/lesson-5-abc-rays.spec.mjs || exit $?
          run_suite absmn npm run test:e2e -- tests/lesson-5-absmn.spec.mjs || exit $?
          run_suite all-lessons npm run test:e2e || exit $?
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit1-lessons-playwright-report
          path: |
            test-results/
            /tmp/abc-rays.log
            /tmp/absmn.log
            /tmp/all-lessons.log
          if-no-files-found: ignore
          retention-days: 7
